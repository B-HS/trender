name: trender

services:
  parser:
    build:
      context: ../apps/parser
      dockerfile: Dockerfile
    image: trender-parser:latest
    container_name: trender-parser
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      TZ: Asia/Seoul
      OPENAI_OAUTH_AUTH_FILE: /var/secrets/codex-auth.json
      PATH: /opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - parser-logs:/var/log
      - cloak-cache:/var/cache/cloakbrowser
      # codex auth 토큰을 컨테이너로 마운트하려면 주석 해제
      # - ${HOME}/.codex/auth.json:/var/secrets/codex-auth.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: 1g

volumes:
  parser-logs:
  cloak-cache:
