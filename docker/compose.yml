name: trender

services:
  mysql:
    image: mysql:8.4
    container_name: trender-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-trender}
      MYSQL_USER: ${MYSQL_USER:-trender}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-trenderpass}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20

  parser:
    build:
      context: ../apps/parser
      dockerfile: Dockerfile
    image: trender-parser:latest
    container_name: trender-parser
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-trender}:${MYSQL_PASSWORD:-trenderpass}@mysql:3306/${MYSQL_DATABASE:-trender}
      LLM_PROVIDERS: ${LLM_PROVIDERS:-ollama_cloud,omlx_local,openrouter,openai_oauth,ollama_local}

      OLLAMA_CLOUD_KEY: ${OLLAMA_CLOUD_KEY:-}
      OLLAMA_CLOUD_HOST: ${OLLAMA_CLOUD_HOST:-https://ollama.com}
      OLLAMA_CLOUD_MODEL: ${OLLAMA_CLOUD_MODEL:-gpt-oss:120b}

      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_LOCAL_MODEL: ${OLLAMA_LOCAL_MODEL:-llama3.1:8b}

      OMLX_HOST: ${OMLX_HOST:-http://host.docker.internal:8080}
      OMLX_MODEL: ${OMLX_MODEL:-mlx-community/Qwen2.5-32B-Instruct-4bit}

      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet}
      OPENROUTER_HOST: ${OPENROUTER_HOST:-https://openrouter.ai/api/v1}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-trender}

      OPENAI_OAUTH_MODEL: ${OPENAI_OAUTH_MODEL:-gpt-4o-mini}
      OPENAI_OAUTH_BASE_URL: ${OPENAI_OAUTH_BASE_URL:-https://api.openai.com/v1}
      OPENAI_OAUTH_TOKEN: ${OPENAI_OAUTH_TOKEN:-}
      OPENAI_OAUTH_AUTH_FILE: ${OPENAI_OAUTH_AUTH_FILE:-/var/secrets/codex-auth.json}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - parser-logs:/var/log
      - cloak-cache:/var/cache/cloakbrowser
      # codex auth 토큰을 컨테이너로 마운트하려면 주석 해제
      # - ${HOME}/.codex/auth.json:/var/secrets/codex-auth.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: 1g

volumes:
  mysql-data:
  parser-logs:
  cloak-cache:
