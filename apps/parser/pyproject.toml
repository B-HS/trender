[project]
name = "trender-parser"
version = "0.1.0"
description = "Trender — AI 트렌드 자동 수집/요약 파이프라인"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "mysql-connector-python>=9.1.0",
    "PyYAML>=6.0.2",
    "tenacity>=9.0.0",
    "ollama>=0.4.4",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "python-dateutil>=2.9.0",
    "structlog>=24.4.0",
    "cloakbrowser>=0.3.0",
    "trafilatura>=1.12.2",
    "markdownify>=1.2.2",
]

[project.scripts]
trender = "trender.main:cli"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trender"]
